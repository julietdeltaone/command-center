<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<title>Recap · Command Center</title>
<style>
:root{--bg:#07090d;--text:#e8eaf2;--muted:#9aa3b8;--line:rgba(200,205,255,.13);--panel:#0d1017;--panel2:#12151f;--accent:#7aa7ff;--amber:#f0b450;--red:#ff6b7a;--green:#5fd48a;--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.55 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;padding:26px clamp(16px,3vw,44px) 44px}
a{color:var(--accent)}
header.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
header.top h1{font-size:26px;letter-spacing:-.02em;margin:0}
header.top .back{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-decoration:none}
header.top .back:hover{color:var(--text)}
header.top .stamp{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.card{border-radius:18px;padding:18px 20px}
.card h2{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px;font-weight:600}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.stack{display:grid;gap:14px}
.item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .when{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:118px}
.item .txt{flex:1}
.item .src{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted);white-space:nowrap;height:fit-content}
.empty{color:var(--muted);padding:8px 0}
.headline{font-size:19px;font-weight:650;letter-spacing:-.01em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:8px;flex:none}
.dot.ok{background:var(--green)} .dot.late{background:var(--amber)} .dot.fail{background:var(--red)}
.rrow{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .nm{flex:1}
.rrow .meta{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
</style>
<link rel="stylesheet" href="../cc-design.css">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" href="../index.html">Command Center</a>
    <h1>Recap</h1>
    <span class="stamp" id="stamp">Loading</span>
  </header>
  <main id="stage">
    <div class="sk"><div></div><div></div><div></div></div>
  </main>
</div>
<script>
(function(){
"use strict";
function getCfg(){ try { var c = JSON.parse(localStorage.getItem("cc_cfg") || "null"); if (c && c.url && c.key) return c; } catch (e) {} return null; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }
function fmtTime(iso){ if (!iso) return "Not available yet"; var d = new Date(iso); if (isNaN(d)) return esc(iso); return d.toLocaleString("en-US", {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone:"America/New_York"}); }
function newestSummary(data, section){ var rows = (data.summary || []).filter(function(s){ return s.section === section; }); return rows.length ? rows[rows.length - 1] : null; }
function routineStatus(r){
  if (!r.last_run) return "nodata";
  if (r.last_status === "fail") return "fail";
  if (typeof r.cadence_min === "number" && r.cadence_min > 0) {
    var ageMin = (Date.now() - new Date(r.last_run)) / 60000;
    if (ageMin > r.cadence_min * 2 + 5) return "late";
  }
  return "ok";
}
function itemRow(i){
  var link = i.link ? ' <a href="' + esc(i.link) + '" target="_blank" rel="noopener">Open</a>' : "";
  return '<div class="item"><span class="when">' + fmtTime(i.time) + '</span><span class="txt">' + esc(i.text) + link +
    '<div class="src">' + esc(i.tab) + ' · ' + esc(i.module) + (i.source ? ' · ' + esc(i.source) : "") + '</div></span><span class="chip">' + esc(i.grade || "") + '</span></div>';
}
function render(data){
  var stamp = document.getElementById("stamp");
  stamp.textContent = "Updated " + fmtTime(data.now || new Date().toISOString());
  var sections = ["Today", "Business", "Local", "Private", "Work", "System"];
  var sumCards = sections.map(function(sec){
    var s = newestSummary(data, sec);
    if (!s) return '<div class="card"><h2>' + esc(sec) + '</h2><div class="empty">Not available yet</div></div>';
    var dot = s.status === "good" ? "ok" : (s.status === "watch" ? "late" : (s.status === "problem" ? "fail" : ""));
    return '<div class="card"><h2>' + esc(sec) + '</h2><div class="headline"><span class="dot ' + dot + '"></span>' + esc(s.headline) + '</div><div class="sub">' + esc(s.text) + '</div><div class="sub">as of ' + fmtTime(s.as_of) + '</div></div>';
  }).join("");
  var routines = (data.routines || []).slice().sort(function(a,b){ return String(a.routine).localeCompare(String(b.routine)); });
  var counts = {ok:0, late:0, fail:0, nodata:0};
  routines.forEach(function(r){ counts[routineStatus(r)]++; });
  var rRows = routines.length ? routines.map(function(r){
    var st = routineStatus(r);
    return '<div class="rrow"><span class="dot ' + (st === "nodata" ? "" : st) + '"></span><span class="nm">' + esc(r.routine) + '</span><span class="meta">' +
      (r.last_run ? fmtTime(r.last_run) : "no run yet") + (r.last_output_count !== "" && r.last_output_count != null ? " · " + esc(r.last_output_count) + " out" : "") + '</span></div>';
  }).join("") : '<div class="empty">Not available yet</div>';
  var latest = (data.items || []).slice().sort(function(a,b){ return new Date(b.time) - new Date(a.time); }).slice(0, 10);
  document.getElementById("stage").innerHTML =
    '<div class="cards">' +
      '<div class="card"><h2>Routines tracked</h2><div class="big">' + routines.length + '</div><div class="sub">on the board</div></div>' +
      '<div class="card"><h2>Running clean</h2><div class="big">' + counts.ok + '</div><div class="sub">' + counts.late + ' late · ' + counts.fail + ' failed · ' + counts.nodata + ' no data</div></div>' +
      '<div class="card"><h2>Board items</h2><div class="big">' + (data.items || []).length + '</div><div class="sub">across every section</div></div>' +
      '<div class="card"><h2>Open problems</h2><div class="big">' + (data.problems || []).filter(function(p){ return p.status === "open"; }).length + '</div><div class="sub">waiting on a fix or a call</div></div>' +
    '</div>' +
    '<div class="sumgrid">' + sumCards + '</div>' +
    '<div class="stack">' +
      '<div class="card"><h2>Routine health</h2>' + rRows + '</div>' +
      '<div class="card"><h2>Latest activity</h2>' + (latest.length ? latest.map(itemRow).join("") : '<div class="empty">Not available yet</div>') + '</div>' +
    '</div>';
}
function fail(msg){
  document.getElementById("stage").innerHTML = '<div class="card"><h2>Recap</h2><div class="empty">' + esc(msg) + '</div></div>';
  document.getElementById("stamp").textContent = "Not available yet";
}
var cfg = getCfg();
if (!cfg) { fail("Not connected yet. Open the Command Center hub and connect first; this page reads through the hub connection."); return; }
fetch(cfg.url + (cfg.url.indexOf("?") > -1 ? "&" : "?") + "key=" + encodeURIComponent(cfg.key))
  .then(function(r){ return r.json(); })
  .then(function(j){ if (!j.ok) throw new Error(j.error || "load failed"); render(j.data); })
  .catch(function(){ fail("Could not load the board. Values are not available yet."); });
})();
</script>
<script src="../cc-motion.js"></script>
</body>
</html>
