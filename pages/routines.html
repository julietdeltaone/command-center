<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>var t=new URLSearchParams(location.search).get("theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark light">
<title>Routines · Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);padding:26px clamp(16px,3vw,44px) 48px}
a{color:var(--accent)}
header.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:22px}
header.top .back{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-decoration:none}
header.top .back:hover{color:var(--text)}
header.top h1{font-size:clamp(28px,3.1vw,40px);font-weight:300;letter-spacing:.05em;margin:0}
header.top .stamp{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.card{border-radius:var(--r);padding:20px 22px}
.card h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600;text-align:center}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;text-align:center}
.sub{color:var(--muted);font-size:13px;margin-top:6px;text-align:center}
.stack{display:grid;gap:var(--gap)}
.item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .when{font-family:var(--font);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:118px}
.item .txt{flex:1}
.item .src{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted);white-space:nowrap;height:fit-content}
.empty{color:var(--muted);padding:8px 0;text-align:center}
.headline{font-size:19px;font-weight:650;letter-spacing:-.01em;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:8px;flex:none}
.dot.ok{background:var(--green)} .dot.late{background:var(--amber)} .dot.fail{background:var(--red)}
.rrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rrow:last-child{border-bottom:0}
.rrow .nm{flex:1;min-width:150px}
.rrow .meta{font-size:12px;color:var(--muted);white-space:nowrap}
</style>
<link rel="stylesheet" href="../cc-design.css">
<link rel="stylesheet" href="../cc-skin.css">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" href="../index.html">Command Center</a>
    <h1>Routines</h1>
    <span class="stamp" id="stamp">Loading</span>
  </header>
  <main id="stage">
    <div class="sk"><div></div><div></div><div></div></div>
  </main>
</div>
<script>
(function(){
"use strict";
function getCfg(){ try { var c = JSON.parse(localStorage.getItem("cc_cfg") || "null"); if (c && c.url && c.key) return c; } catch (e) {} return null; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }
function fmtTime(iso){ if (!iso) return "Not available yet"; var d = new Date(iso); if (isNaN(d)) return esc(iso); return d.toLocaleString("en-US", {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone:"America/New_York"}); }
function items(data, tab, module){ return (data.items || []).filter(function(i){ return i.tab === tab && i.module === module; }).slice().sort(function(a,b){ return new Date(b.time) - new Date(a.time); }); }
function summary(data, section){ var rows = (data.summary || []).filter(function(s){ return s.section === section; }); return rows.length ? rows[rows.length - 1] : null; }
function itemRow(i){
  var link = i.link ? ' <a href="' + esc(i.link) + '" target="_blank" rel="noopener">Open</a>' : "";
  return '<div class="item"><span class="when">' + fmtTime(i.time) + '</span><span class="txt">' + esc(i.text) + link +
    (i.source ? '<div class="src">' + esc(i.source) + '</div>' : "") + '</span><span class="chip">' + esc(i.grade || "") + '</span></div>';
}
function listOrEmpty(rows){ return rows.length ? rows.map(itemRow).join("") : '<div class="empty">Not available yet</div>'; }
function routineStatus(rt){
  if (!rt.last_run) return "nodata";
  if (rt.last_status === "fail") return "fail";
  if (typeof rt.cadence_min === "number" && rt.cadence_min > 0) {
    var ageMin = (Date.now() - new Date(rt.last_run)) / 60000;
    if (ageMin > rt.cadence_min * 2 + 5) return "late";
  }
  return "ok";
}
function cadence(rt){
  if (rt.cadence) return esc(rt.cadence);
  var m = rt.cadence_min;
  if (typeof m !== "number" || !m) return "Not available yet";
  if (m < 60) return "every " + m + " min";
  if (m === 60) return "hourly";
  if (m === 1440) return "daily";
  if (m === 10080) return "weekly";
  if (m % 1440 === 0) return "every " + (m / 1440) + " days";
  if (m % 60 === 0) return "every " + (m / 60) + " h";
  return "every " + m + " min";
}
function render(data){
  var stamp = document.getElementById("stamp");
  stamp.textContent = "Updated " + fmtTime(data.now || new Date().toISOString());
  var routines = (data.routines || []).slice().sort(function(a,b){
    var t = String(a.tab || "").localeCompare(String(b.tab || ""));
    return t !== 0 ? t : String(a.routine).localeCompare(String(b.routine));
  });
  var counts = {ok:0, late:0, fail:0, nodata:0};
  routines.forEach(function(rt){ counts[routineStatus(rt)]++; });
  var tabs = [];
  routines.forEach(function(rt){ var tb = rt.tab || "Other"; if (tabs.indexOf(tb) === -1) tabs.push(tb); });
  var groups = tabs.map(function(tb){
    var rows = routines.filter(function(rt){ return (rt.tab || "Other") === tb; }).map(function(rt){
      var st = routineStatus(rt);
      var stWord = st === "nodata" ? "no data" : st;
      return '<div class="rrow"><span class="dot ' + (st === "nodata" ? "" : st) + '"></span><span class="nm">' + esc(rt.routine) +
        '<div class="src">' + esc(rt.module || "") + ' · ' + stWord + '</div></span>' +
        '<span class="meta">' + cadence(rt) + '</span>' +
        '<span class="meta">' + (rt.last_run ? fmtTime(rt.last_run) : "no run yet") + '</span>' +
        '<span class="meta">' + (rt.last_output_count !== "" && rt.last_output_count != null ? esc(rt.last_output_count) + " out" : "") + '</span></div>';
    }).join("");
    return '<div class="card"><h2>' + esc(tb) + '</h2>' + rows + '</div>';
  }).join("");
  document.getElementById("stage").innerHTML =
    '<div class="cards">' +
      '<div class="card"><h2>Routines tracked</h2><div class="big">' + routines.length + '</div><div class="sub">on the board</div></div>' +
      '<div class="card"><h2>Running clean</h2><div class="big">' + counts.ok + '</div><div class="sub">on schedule</div></div>' +
      '<div class="card"><h2>Late</h2><div class="big">' + counts.late + '</div><div class="sub">past cadence</div></div>' +
      '<div class="card"><h2>Failed</h2><div class="big">' + counts.fail + '</div><div class="sub">' + counts.nodata + ' with no data yet</div></div>' +
    '</div>' +
    '<div class="stack">' + (groups || '<div class="card"><h2>Routines</h2><div class="empty">Not available yet</div></div>') + '</div>';
}
function fail(msg){
  document.getElementById("stage").innerHTML = '<div class="card"><h2>Routines</h2><div class="empty">' + esc(msg) + '</div></div>';
  document.getElementById("stamp").textContent = "Not available yet";
}
var cfg = getCfg();
if (!cfg) { fail("Not connected yet. Open the Command Center hub and connect first; this page reads through the hub connection."); return; }
fetch(cfg.url + (cfg.url.indexOf("?") > -1 ? "&" : "?") + "key=" + encodeURIComponent(cfg.key))
  .then(function(r){ return r.json(); })
  .then(function(j){ if (!j.ok) throw new Error(j.error || "load failed"); render(j.data); })
  .catch(function(){ fail("Could not load the board. Values are not available yet."); });
})();
</script>
<script src="../cc-motion.js"></script>
</body>
</html>
