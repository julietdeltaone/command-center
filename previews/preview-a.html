<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script>try{if(localStorage.getItem("cc_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<title>Command Center — Preview A v2</title>
<style>
/* ═══════════════ TOKENS ═══════════════ */
:root {
  --bg:#07090d; --bg2:#0c0f16; --panel:#111520; --panel2:#171d2a;
  --line:#1e2538; --line2:#283048; --text:#eef2f8; --muted:#8792a6;
  --accent:#7aa7ff; --violet:#b18cff; --amber:#f0b450; --red:#ff6b7a;
  --green:#5fd48a; --ring:#586377; --cyan:#5ec8d8;
  --hs:72%; --hl:62%;
  --font: 'Manrope', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f0f2f7; --bg2:#e8ebf2; --panel:#fff; --panel2:#f5f7fb;
    --line:#d8dce6; --line2:#c8cdd8; --text:#1a1e2a; --muted:#5a6478;
    --accent:#3b7ae0; --violet:#8a5ec8; --amber:#c08520; --red:#d04050;
    --green:#2a9a55; --ring:#a0a8b8; --cyan:#2a8a9a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:#f0f2f7; --bg2:#e8ebf2; --panel:#fff; --panel2:#f5f7fb;
  --line:#d8dce6; --line2:#c8cdd8; --text:#1a1e2a; --muted:#5a6478;
  --accent:#3b7ae0; --violet:#8a5ec8; --amber:#c08520; --red:#d04050;
  --green:#2a9a55; --ring:#a0a8b8; --cyan:#2a8a9a;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);margin:0;font-size:13px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}

/* Aurora bg */
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(122,167,255,.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 80% 70%,rgba(177,140,255,.05) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 50% 90%,rgba(95,212,138,.04) 0%,transparent 70%);animation:aurora 30s ease-in-out infinite alternate}
@keyframes aurora{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}

/* ═══════════════ SHELL ═══════════════ */
.shell{display:flex;min-height:100vh}
.rail{width:52px;min-height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;position:fixed;top:0;left:0;z-index:100}
.rail-logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;margin-bottom:12px}
.rail-tabs{display:flex;flex-direction:column;gap:1px;flex:1}
.rail-btn{width:38px;height:38px;border:none;background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s,color .15s}
.rail-btn:hover{background:var(--panel2);color:var(--text)}
.rail-btn[aria-current="true"]{background:var(--accent);color:#fff}
.rail-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-btn .badge{position:absolute;top:3px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.rail-btn .badge:empty{display:none}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:1px}

.main{margin-left:52px;flex:1;min-width:0;padding:0 16px 20px}

/* ═══════════════ TOPBAR ═══════════════ */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 0 6px;border-bottom:1px solid var(--line);margin-bottom:10px;position:sticky;top:0;background:var(--bg);z-index:50}
.topbar h1{font-size:13px;font-weight:800;letter-spacing:.06em;margin:0;flex:1;text-transform:uppercase}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sample-tag{font-size:9px;padding:2px 5px;background:var(--amber);color:#000;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.top-btn{width:28px;height:28px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.top-btn:hover{background:var(--panel2);color:var(--text)}
.top-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ═══════════════ STATUS STRIP ═══════════════ */
.ss{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:12px}
.ss-p{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .15s}
.ss-p:hover{border-color:var(--accent)}
.ss-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ss-d.good{background:var(--green)}.ss-d.watch{background:var(--amber)}.ss-d.alert{background:var(--red)}.ss-d.none{background:var(--muted)}
.ss-p b{font-size:11px;font-weight:600}
.ss-p small{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

/* ═══════════════ SECTION / CARDS ═══════════════ */
.sh{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.sh h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.sh::after{content:'';flex:1;height:1px;background:var(--line)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card-h h3{font-size:12px;font-weight:700;margin:0;flex:1}
.card-h .cnt{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ═══════════════ STAT TILES ═══════════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat-v{font-size:22px;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:5px}
.stat-l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.stat-sp{margin-top:3px}
.stat-sp svg{width:100%;height:20px}
.trend{font-size:11px;font-weight:600}
.trend.up{color:var(--green)}.trend.dn{color:var(--red)}.trend.flat{color:var(--muted)}

/* ═══════════════ COMPACT TABLE ═══════════════ */
.ct{width:100%;border-collapse:collapse;font-size:12px}
.ct th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:3px 6px;border-bottom:1px solid var(--line)}
.ct td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ct tr:last-child td{border-bottom:none}
.ct tr:hover td{background:var(--panel2)}

/* ═══════════════ DOT / PILL ═══════════════ */
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;vertical-align:middle;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.late{background:var(--amber)}.dot.fail,.dot.stale{background:var(--red)}.dot.none,.dot.nodata{background:var(--muted)}
.fp{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-family:var(--mono);color:var(--muted);padding:1px 5px;border-radius:3px;background:var(--panel2);white-space:nowrap}
.fp .dot{width:5px;height:5px}

/* ═══════════════ ITEM ROWS ═══════════════ */
.ir{display:flex;align-items:baseline;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.ir:last-child{border-bottom:none}
.ir .src{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap;margin-left:auto;flex-shrink:0}
.due{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--amber);color:#000;font-weight:600;white-space:nowrap;flex-shrink:0}
.due.past{background:var(--red);color:#fff}

/* ═══════════════ LAYOUTS ═══════════════ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:1000px){.three{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}}

/* ═══════════════ CREW ═══════════════ */
.crew-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:10px;color:#fff;flex-shrink:0}

/* ═══════════════ MESSAGES ═══════════════ */
.mr{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
.mr:last-child{border-bottom:none}
.mr .mf{font-weight:600;white-space:nowrap;min-width:40px}
.mr .ma{color:var(--muted)}
.mr .mt{font-weight:500;color:var(--muted);white-space:nowrap;min-width:40px}
.mr .mx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .mti{font-family:var(--mono);color:var(--muted);white-space:nowrap;flex-shrink:0;font-size:10px}

/* ═══════════════ PIPELINE ═══════════════ */
.pipe-s{display:flex;gap:2px;margin-bottom:6px}
.pipe-s span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.pipe-s span.f{background:var(--accent)}
.pc{padding:6px 8px;border:1px solid var(--line);border-radius:5px;margin-bottom:4px}
.pc h4{margin:0;font-size:12px;font-weight:600}
.pc .meta{font-size:10px;color:var(--muted)}
.pc .nx{font-size:11px;margin-top:3px;padding:3px 6px;background:var(--panel2);border-radius:3px}

/* ═══════════════ BODY MAP ═══════════════ */
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px}
.bc{padding:5px 6px;border-radius:5px;text-align:center;font-size:10px;font-weight:600;border:1px solid var(--line)}

/* ═══════════════ RECORDS ═══════════════ */
.rd h4{font-size:11px;font-weight:700;margin:0 0 3px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.rd{margin-bottom:8px}
.rr{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0}
.rb{flex:0 0 40px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rb i{display:block;height:100%;background:var(--green);border-radius:2px}

/* ═══════════════ PROBLEMS ═══════════════ */
.pr{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
.pr:last-child{border-bottom:none}
.pr .pi{font-family:var(--mono);color:var(--accent);font-weight:600;white-space:nowrap}
.pr .pt{flex:1}
.pr .po{font-size:10px;color:var(--muted);white-space:nowrap}

/* ═══════════════ SKELETONS ═══════════════ */
.sk{animation:shimmer 1.5s ease-in-out infinite alternate}
@keyframes shimmer{0%{opacity:.5}100%{opacity:.15}}
.skl{height:12px;border-radius:3px;background:var(--line);margin-bottom:6px}
.sks{height:60px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}

/* ═══════════════ MOBILE ═══════════════ */
@media(max-width:700px){
  .rail{display:none}
  .main{margin-left:0;padding-bottom:64px}
  .mob{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:3px 0 max(3px,env(safe-area-inset-bottom,0px))}
  .mob button{flex:1;border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:9px;font-family:var(--font);cursor:pointer;position:relative}
  .mob button[aria-current="true"]{color:var(--accent)}
  .mob button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mob .badge{position:absolute;top:0;right:calc(50% - 16px);min-width:12px;height:12px;border-radius:6px;background:var(--red);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 2px}
  .mob .badge:empty{display:none}
}
@media(min-width:701px){.mob{display:none}}

/* ═══════════════ UTILS ═══════════════ */
.empty{text-align:center;padding:16px;color:var(--muted);font-size:12px}
.rt-s{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sp{display:inline-block;vertical-align:middle}
.sp svg{vertical-align:middle}
.warn-b{border-color:var(--amber)!important}
</style>
</head>
<body>

<div class="shell">
<nav class="rail" id="rail"></nav>
<div class="main" id="main">
  <div class="topbar">
    <h1>Command Center</h1>
    <span class="live" id="live-ind">Live</span>
    <span class="sample-tag" id="stag" hidden>SAMPLE</span>
    <button class="top-btn" id="rbtn" title="Refresh"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
    <button class="top-btn" id="tbtn" title="Theme"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg></button>
  </div>
  <div id="app"></div>
</div>
</div>
<nav class="mob" id="mob"></nav>

<script>
(function(){
"use strict";
/* ══════════ CONFIG ══════════ */
var TABS=[
  {id:"wall",l:"Wall",i:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'},
  {id:"today",l:"Today",i:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
  {id:"biz",l:"Business",i:'<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>'},
  {id:"priv",l:"Private",i:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'},
  {id:"sys",l:"System",i:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'},
  {id:"crew",l:"Crew",i:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'}
];
var CREW=[
  {k:"claude",n:"Atlas",c:"var(--accent)",r:"Ops lead"},
  {k:"muse",n:"Luna",c:"var(--violet)",r:"Researcher"},
  {k:"chatgpt",n:"Argus",c:"var(--green)",r:"QA + push"},
  {k:"claude-jdm",n:"Athena",c:"var(--amber)",r:"Strategy"},
  {k:"iphone",n:"Orion",c:"var(--cyan)",r:"Phone telemetry"}
];
var TAB="wall",D=null;

/* ══════════ DOM ══════════ */
function h(t,p){var e=document.createElement(t);if(p)for(var k in p){var v=p[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(typeof x==="string"?document.createTextNode(x):x)});else e.appendChild(typeof c==="string"?document.createTextNode(c):c)}return e}
function iso(m){return new Date(Date.now()-m*60000).toISOString()}
function ago(s){if(!s)return"—";var m=Math.round((Date.now()-new Date(s).getTime())/60000);if(m<1)return"now";if(m<60)return m+"m";var hr=Math.round(m/60);if(hr<48)return hr+"h";return Math.round(hr/24)+"d"}
function usd(n){return"$"+Math.round(n).toLocaleString("en-US")}
function clk(s){if(!s)return"";return new Date(s).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}

/* Sparkline */
function sp(vals,w,ht,col){
  w=w||56;ht=ht||18;if(!vals||vals.length<2)return h("span",{class:"sp"});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rn=mx-mn||1;
  var pts=vals.map(function(v,i){return(i/(vals.length-1)*w).toFixed(1)+","+(ht-2-(v-mn)/rn*(ht-4)).toFixed(1)}).join(" ");
  var s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width",w);s.setAttribute("height",ht);s.setAttribute("viewBox","0 0 "+w+" "+ht);
  var p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  p.setAttribute("points",pts);p.setAttribute("fill","none");p.setAttribute("stroke",col||"var(--accent)");p.setAttribute("stroke-width","1.5");p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round");
  s.appendChild(p);var el=h("span",{class:"sp"});el.appendChild(s);return el;
}
/* Freshness pill */
function fp(ts,rhy){
  if(!ts)return h("span",{class:"fp"},h("span",{class:"dot none"}),"—");
  var age=(Date.now()-(typeof ts==="number"?ts:new Date(ts).getTime()))/60000;
  var lv=age<=rhy*1.5?"ok":age<=rhy*3?"late":"stale";
  var t=age<60?Math.round(age)+"m":age<1440?Math.round(age/60)+"h":Math.round(age/1440)+"d";
  return h("span",{class:"fp"},h("span",{class:"dot "+lv}),t);
}
/* Trend */
function tr(vals){
  if(!vals||vals.length<2)return null;
  var l=vals[vals.length-1],p=vals[vals.length-2],pct=p?Math.round((l-p)/p*100):0;
  if(pct>0)return h("span",{class:"trend up"},"↑"+pct+"%");
  if(pct<0)return h("span",{class:"trend dn"},"↓"+Math.abs(pct)+"%");
  return h("span",{class:"trend flat"},"→");
}
/* Section header */
function sh(title,extra){var e=h("div",{class:"sh"},h("h2",null,title));if(extra)e.insertBefore(extra,e.lastChild);return e}

/* ══════════ SAMPLE DATA ══════════ */
function sampleData(){
  return{
    now:new Date().toISOString(),sample:true,
    summary:[
      {section:"Today",headline:"2 items due",status:"watch"},
      {section:"Business",headline:"Pipeline healthy",status:"good"},
      {section:"Private",headline:"Week on track",status:"good"},
      {section:"System",headline:"3 problems open",status:"watch"},
      {section:"Crew",headline:"All active",status:"good"}
    ],
    items:[
      {tab:"Today",mod:"Watch",text:"Pool rec swim cancelled today",src:"Facility",time:iso(40)},
      {tab:"Today",mod:"Watch",text:"Scholarship email approval due today",src:"Clarkson",time:iso(160),due:new Date(Date.now()+8*3600000).toISOString()},
      {tab:"Today",mod:"Calendar",text:"Work shift 7:30 AM – 3:30 PM",src:"Calendar",time:iso(160)},

function its(tab,mod){if(!D)return[];return(D.items||[]).filter(function(i){return i.tab===tab&&(!mod||i.mod===mod)}).sort(function(a,b){return new Date(b.time)-new Date(a.time)})}
function newest(list){if(!list.length)return null;return list.reduce(function(b,i){var t=new Date(i.time).getTime();return t>b?t:b},0)}
function sumOf(s){if(!D)return null;return(D.summary||[]).find(function(x){return x.section===s})}
function parseLed(){
  return its("Business","Ledger").map(function(r){
    var ps=r.text.split("|").map(function(s){return s.trim()}),o={raw:r};
    ps.forEach(function(p){var m=/^([A-Za-z ]+):\s*(.*)$/.exec(p);if(m)o[m[1].toLowerCase().replace(/\s+/g,"_")]=m[2];else if(!o.id_)o.id_=p});
    o.total=parseInt(o.total)||0;o.collected=parseInt(o.collected)||0;o.balance=o.total-o.collected;return o;
  });
}
function parseNur(){
  var STAGES=["Inquiry","Talking","Contract","Deposit","Booked"];
  return its("Business","Nurturing").map(function(r){
    var ps=r.text.split("|").map(function(s){return s.trim()}),o={name:ps[0],raw:r};
    ps.slice(1).forEach(function(p){var m=/^([A-Za-z_ ]+):\s*(.*)$/.exec(p);if(m)o[m[1].toLowerCase().replace(/\s+/g,"_")]=m[2]});

  });

function parseRec(){
  var recs=its("Records"),groups={},exp=[];
  recs.forEach(function(r){
