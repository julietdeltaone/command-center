<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090b14">
<script>try{if(localStorage.getItem("cc_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap">
<title>Command Center</title>
<style>
:root{
  --bg:#07090d; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09);
  --text:#eef2f8; --muted:#8792a6; --accent:#7aa7ff; --violet:#b18cff;
  --amber:#f0b450; --red:#ff6b7a; --ring:#586377;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;
  background:
    radial-gradient(900px 420px at 15% -8%, rgba(122,167,255,.16), transparent 60%),
    radial-gradient(700px 380px at 95% 0%, rgba(177,140,255,.12), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;color:var(--muted);font-weight:600}

header{padding:calc(18px + env(safe-area-inset-top)) 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(122,167,255,.25),rgba(177,140,255,.18))}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
h1{font-size:15px;margin:0;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.hbtns{display:flex;gap:8px}
.ibtn{appearance:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  display:grid;place-items:center;cursor:pointer;font:inherit}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.banner{border:1px solid rgba(122,167,255,.5);background:rgba(122,167,255,.1);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14.5px}
.error{border:1px solid rgba(255,107,122,.5);background:rgba(255,107,122,.1);border-radius:12px;padding:12px 14px;margin:0 0 14px}

.hero{display:grid;gap:14px;margin-bottom:22px}
@media(min-width:760px){.hero{grid-template-columns:1.15fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gauge{padding:18px 18px 16px;text-align:center}
.gauge svg{width:100%;max-width:340px;height:auto;display:block;margin:6px auto 0;overflow:visible}
.g-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12;stroke-linecap:round}
.g-fill{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(122,167,255,.55))}
.g-fill.amber{stroke:var(--amber);filter:drop-shadow(0 0 8px rgba(240,180,80,.5))}
.g-fill.red{stroke:var(--red);filter:drop-shadow(0 0 8px rgba(255,107,122,.5))}
.g-tick{stroke:var(--text);stroke-width:2.5;stroke-linecap:round}
.g-pct{font-size:44px;font-weight:700;letter-spacing:-.03em;fill:var(--text)}
.g-word{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;fill:var(--muted);font-weight:600}
.gmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;text-align:left}
.gmeta b{display:block;font-size:15px;margin-top:2px;font-weight:600}
.gna{padding:26px 18px;text-align:center}
.gna .big{font-size:26px;font-weight:700;margin:8px 0 4px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.tnum{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.tnote{font-size:13px;color:var(--muted)}
.tile.warn{border-color:rgba(240,180,80,.55);background:rgba(240,180,80,.07)}
.tile.warn .tnum{color:var(--amber)}
.tile.bad{border-color:rgba(255,107,122,.55);background:rgba(255,107,122,.07)}

.tabhead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 14px}
.tabhead h2{font-size:28px;margin:0;letter-spacing:-.02em}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;justify-content:center;gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(7,9,13,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
}
.tab{
  appearance:none;flex:1;max-width:150px;min-height:52px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--muted);
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.tab .n{font-family:var(--mono);font-size:11px;opacity:.8}
.tab[aria-selected="true"]{color:var(--text);background:var(--panel2);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}

.mod{padding:16px 18px;margin-bottom:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mod h3{margin:0;font-size:17px;letter-spacing:-.01em}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}
.dot.ok{background:var(--accent);box-shadow:0 0 8px var(--accent)} .dot.late{background:var(--amber)} .dot.fail{background:var(--red)}
.dot.nodata,.dot.none{background:transparent;border:2px solid var(--ring)}
.empty{color:var(--muted);font-size:15px;padding:12px 0 2px}

.item{position:relative;margin-top:12px;padding:12px 0 4px 14px;border-top:1px solid var(--line)}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.item.s-Single::before,.item.s-Image::before{background:var(--amber)}
.item.s-Derived::before{background:var(--ring)}
.item.s-Gap::before{background:var(--red)}
.itext{font-weight:600}
.imeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:5px;color:var(--muted);font-size:13.5px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--text)}
.chip.Exact,.chip.Confirmed{background:rgba(122,167,255,.18);border-color:rgba(122,167,255,.6);color:#cfe0ff}
.chip.Single,.chip.Image{border-color:var(--amber);color:var(--amber)}
.chip.Derived{color:var(--muted)}
.chip.Gap{border-color:var(--red);color:var(--red)}
.acts{display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
.btn{
  appearance:none;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font:inherit;font-size:14.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center
}
.btn.link{border-color:rgba(122,167,255,.6);color:var(--accent)}
.field{width:100%;min-height:48px;margin-top:10px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}

.embed{display:block;width:100%;height:80vh;min-height:520px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#0b0c14}
.grades{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.sysc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel)}
.sysc.late{border-color:rgba(240,180,80,.55)} .sysc.fail{border-color:rgba(255,107,122,.6)}
.sysc .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.sysc .st{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px 6px 0;font-weight:600}
td{padding:10px 6px 10px 0;border-top:1px solid var(--line)}
.opts{margin:6px 0 0;padding-left:18px}
.pid{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);margin-right:8px}

/* ---------- wall ---------- */
.wrap.wide{max-width:1280px}
:root{--green:#5fd48a}
.wall{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.ws3{grid-column:span 3}.ws4{grid-column:span 4}.ws5{grid-column:span 5}.ws6{grid-column:span 6}.ws7{grid-column:span 7}.ws8{grid-column:span 8}
.wt{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .2s}
.wt:hover{border-color:rgba(122,167,255,.5)}
.wh{min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wopen{appearance:none;background:none;border:0;color:var(--accent);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;cursor:pointer;min-height:44px;padding:0 4px;font-weight:600}
.wbig{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.wbig small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px}
.wnote{font-size:13.5px;color:var(--muted)}
.walert{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid rgba(255,107,122,.55);background:rgba(255,107,122,.1);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14.5px}
.walert b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--red)}
.wbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 14px;flex-wrap:wrap}
.tl{position:relative;height:96px;border-top:1px solid var(--line);margin-top:2px}
.tl .hr{position:absolute;top:0;height:100%;border-left:1px solid rgba(255,255,255,.06)}
.tl .hr span{position:absolute;top:76px;left:4px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tl .blk{position:absolute;height:26px;border-radius:6px;border:1px solid rgba(122,167,255,.55);background:rgba(122,167,255,.16);padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.tl .now{position:absolute;top:0;height:72px;border-left:2px solid var(--accent)}
.tl .now span{position:absolute;top:-2px;left:6px;font-family:var(--mono);font-size:10px;color:var(--accent)}
.cells{display:grid;gap:3px}
.cells i{display:block;height:26px;border-radius:3px;background:rgba(95,212,138,.55)}
.cells i.late{background:var(--amber)} .cells i.fail{background:var(--red)} .cells i.nodata{background:transparent;border:1px solid var(--ring)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.wk>div{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
.wk .dn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.wk .ev{display:flex;gap:8px;font-size:12.5px;line-height:1.35}
.wk .ev em{font-style:normal;font-family:var(--mono);color:var(--accent);flex:0 0 auto}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.mrow:first-of-type{border-top:0}
.mrow .nm{font-weight:600;flex:1}
.mrow .ct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lockbox{position:relative;flex:1;min-height:130px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25)}
.lockbox .ghost{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:10px;filter:blur(7px);opacity:.7}
.lockbox .ghost i{display:block;border-radius:4px;background:rgba(122,167,255,.25)}
.lockbox .lk{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--text)}
.pv{position:relative;height:230px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b0c14}
.pv iframe{position:absolute;top:0;left:0;width:1280px;height:820px;border:0;transform:scale(.28);transform-origin:top left;pointer-events:none}
.pv a{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px;text-decoration:none;color:var(--accent);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;background:linear-gradient(180deg,transparent 60%,rgba(7,9,13,.85))}
@media (max-width:1000px){.ws3,.ws4,.ws5{grid-column:span 6}.ws6,.ws7,.ws8{grid-column:span 12}}
@media (max-width:640px){.ws3,.ws4,.ws5,.ws6,.ws7,.ws8{grid-column:span 12}}

/* ---------- crew activity map ---------- */
.ca-lane{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6}
.ca-name{fill:var(--text);font-size:13px;font-weight:600}
.ca-sub{fill:var(--muted);font-size:10px;letter-spacing:.08em}
.ca-link{fill:none;stroke-width:1.4;opacity:.38}
.ca-dot{transform-box:fill-box;transform-origin:center;animation:capop .5s var(--ease,ease) backwards;cursor:default}
.ca-dot:hover{transform:scale(1.5);transition:transform .2s}
@keyframes capop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.ca-ring{fill:none;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:caring 2.4s ease-out infinite}
@keyframes caring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
.ca-g{fill:#4ade80;stroke:#4ade80} .ca-y{fill:var(--amber);stroke:var(--amber)} .ca-r{fill:var(--red);stroke:var(--red)}
.ca-link.ca-g,.ca-link.ca-y,.ca-link.ca-r,.ca-ring{fill:none}
.ca-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch} .ca-scroll svg{min-width:720px;display:block}
.ca-counts{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 10px}
.ca-counts span{font-size:13px;color:var(--muted)} .ca-counts b{font-size:22px;color:var(--text);margin-right:6px}
.ca-feed{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ca-feed div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.ca-feed .st{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:5px}
.ca-feed .st.g{background:#4ade80} .ca-feed .st.y{background:var(--amber)} .ca-feed .st.r{background:var(--red)}
.ca-feed .who{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}
</style>

<body>
<div class="wrap" id="wrap">
  <header>
    <div class="brand">
      <div class="mark"><i></i></div>
      <h1>Command Center</h1>
      <div class="sub" id="hdate"></div>
    </div>
    <div class="hbtns">
      <button class="ibtn icon" id="theme" type="button" aria-label="Switch theme" title="Switch theme"></button>
      <span class="pill off" id="livepill"><i></i><span id="refreshed">Loading</span></span>
      <button class="ibtn icon" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="ibtn icon" id="disconnect" type="button" aria-label="Disconnect" title="Disconnect"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button>
    </div>
  </header>
  <div id="app"></div>
</div>
<aside class="rail" id="rail" aria-label="Quick jump"></aside>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>

<script>window.CC = window.CC || {views: {}, subviews: {}};</script>
<script>
(function(){
"use strict";

var DATA = null;
var TAB = "Wall";
var KEY2 = null;       /* second key, kept in memory only, never stored */
var idleTimer = null, hideTimer = null, LOCK_AFTER_MIN = 5;
function isUnlocked(){ return !!(DATA && (DATA.tier2 || DATA.sample)); }
function lockNow(){ KEY2 = null; clearTimeout(idleTimer); clearTimeout(hideTimer); if (getCfg()) load(); }
function armIdle(){
  clearTimeout(idleTimer);
  if (KEY2) idleTimer = setTimeout(lockNow, LOCK_AFTER_MIN * 60000);
}
function unlockPrompt(note){
  var app = document.getElementById("app");
  var key = h("input", {class: "field", type: "password", placeholder: "Second key", autocomplete: "off"});
  var msg = h("div", {class: "empty"}, note || "");
  function submit(){
    var v = key.value.trim();
    if (!v) { msg.textContent = "Enter the second key."; return; }
    KEY2 = v; load(true);
  }
  key.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
  app.textContent = "";
  app.appendChild(h("section", {class: "card mod"},
    h("h3", null, "Unlock Private and Work"),
    h("div", {class: "empty"}, "These sections need a second key. It is kept in this tab only and locks again after " + LOCK_AFTER_MIN + " idle minutes or when you leave the page."),
    key, msg,
    h("div", {class: "acts"},
      h("button", {class: "btn link", type: "button", onclick: submit}, "Unlock"),
      h("button", {class: "btn", type: "button", onclick: function(){ render(); }}, "Cancel"))));
  key.focus();
}
function lockScreen(name){
  return h("section", {class: "card mod"},
    h("div", {class: "mhead"}, h("h3", null, name + " is locked")),
    lockBox(),
    h("div", {class: "acts"}, h("button", {class: "btn link", type: "button", onclick: function(){ unlockPrompt(); }}, "Unlock Private and Work")));
}
var TABS = ["Wall", "Today", "Business", "Local", "Private", "System"];
var TABLABEL = {Wall: "Overview"};
var PAGES = {
  Today: [{name: "Recap", url: "pages/recap.html"}],
  Business: [{name: "Business Pulse", url: "https://julietdeltaone.github.io/business-pulse/"}, {name: "Leads", url: "pages/leads.html"}, {name: "Marketing", url: "pages/marketing.html"}],
  Local: [{name: "Local events", url: "pages/local.html"}]
};

function h(tag, props){
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if (k === "class") e.className = v;
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  });
  Array.prototype.slice.call(arguments, 2).forEach(function add(c){
    if (c == null || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}
function svg(tag, attrs){
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  Array.prototype.slice.call(arguments, 2).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

/* ---------- time ---------- */
function nowMs(){ return DATA ? new Date(DATA.now).getTime() : Date.now(); }
function ago(iso){
  if (!iso) return "never";
  var m = Math.round((nowMs() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  var hr = Math.round(m / 60);
  if (hr < 48) return hr + " hr ago";
  return Math.round(hr / 24) + " days ago";
}
function dueLabel(iso){
  if (!iso) return "";
  var d = new Date(iso);

  var line = pts.map(function(q, i){ return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");

    svgEl("path", {d: line, "class": "sp-l"}),

function showError(err){
  var app = document.getElementById("app");

  app.insertBefore(h("div", {class: "error"}, "Could not load: " + msg), app.firstChild);
}

/* ---------- connection (kept only in this browser) ---------- */
var memCfg = null;
function getCfg(){
  try {
    var c = JSON.parse(localStorage.getItem("cc_cfg") || "null");
    if (c && c.url && c.key) return c;
  } catch (e) {}
  return memCfg;
}
function setCfg(c){ memCfg = c; try { localStorage.setItem("cc_cfg", JSON.stringify(c)); } catch (e) {} }
function clearCfg(){ memCfg = null; try { localStorage.removeItem("cc_cfg"); } catch (e) {} }

function connectScreen(note){
  DATA = null;
  document.getElementById("refreshed").textContent = "Not connected";
  document.getElementById("livepill").classList.add("off");
  var app = document.getElementById("app");
  app.textContent = "";
  var url = h("input", {class: "field", type: "url", placeholder: "Web app URL (ends in /exec)", autocomplete: "off"});
  var key = h("input", {class: "field", type: "password", placeholder: "Access key", autocomplete: "off"});
  var msg = h("div", {class: "empty"}, note || "");
  function go(){
    var c = {url: url.value.trim(), key: key.value.trim()};
    if (!c.url || !c.key) { msg.textContent = "Both fields are required."; return; }
    setCfg(c); load();
  }
  app.appendChild(h("section", {class: "mod"},
    h("h3", null, "Connect"),
    h("div", {class: "empty"}, "Enter the web app URL and access key from your Apps Script project. They are stored only in this browser."),
    url, key, msg,
    h("div", {class: "acts"},
      h("button", {class: "btn link", type: "button", onclick: go}, "Connect"),
      h("button", {class: "btn", type: "button", onclick: function(){ DATA = preview(); render(); }}, "Preview sample"))));
}

/* ---------- data ---------- */
function fixData(d){
  /* A row written one column short (options missing) shifts everything after it left. Put it back. */
  (d.problems || []).forEach(function(p){
    if (/^\d{4}-\d\d-\d\d/.test(String(p.status || ""))) {
      p.opened = p.status; p.status = p.owner; p.owner = p.options; p.options = "";
    }
  });
  return d;
}
function skeleton(){
  var app = document.getElementById("app");
  if (app && !app.firstChild) app.appendChild(h("div", {class: "sk"}, h("div"), h("div"), h("div"), h("div"), h("div"), h("div")));
}
function load(fromUnlock){
  var cfg = getCfg();
  if (!cfg) { if (!DATA) connectScreen(); return; }
  if (!DATA) skeleton();
  fetch(cfg.url + (cfg.url.indexOf("?") > -1 ? "&" : "?") + "key=" + encodeURIComponent(cfg.key) + (KEY2 ? "&key2=" + encodeURIComponent(KEY2) : ""))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error);
      DATA = fixData(j.data);
      if (KEY2 && !DATA.tier2) { KEY2 = null; render(); unlockPrompt("That key was not accepted."); return; }
      render(); armIdle();
    })
    .catch(showError);
}

function themeIs(){ return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }

  b.title = light ? "Switch to dark theme" : "Switch to light theme";
  b.setAttribute("aria-label", b.title);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", light ? "#dde2f5" : "#090b14");
}
document.getElementById("theme").addEventListener("click", function(){
  var next = themeIs() === "light" ? "dark" : "light";
  if (next === "light") document.documentElement.setAttribute("data-theme", "light"); else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("cc_theme", next); } catch (e) {}

});
