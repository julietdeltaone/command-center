<!-- ════════════════════════════════════════════════════════════════════════
     BUILD VERSION — single source of truth: 20261125.19
     Bump this (date.N, +1 each push) AND find/replace every "?v=20261125.19"
     below AND the BUILD constant near the top of the main script, together,
     in the same commit, whenever index.html or any cc-*/views/* file changes.
     Browsers and GitHub Pages' CDN cache by the exact URL including the
     query string, so an unchanged version number means an unchanged URL —
     a real edit can go live on GitHub and still not visibly change for
     anyone whose browser already has the old version cached. The version
     badge next to the live/offline indicator (top right) is how JD confirms
     what's actually loaded without guessing from a hard refresh.
     ════════════════════════════════════════════════════════════════════════ -->

<style>
/* ═══════════════ TOKENS ═══════════════ */
:root {
  --bg:#07090d; --bg2:#0c0f16; --panel:#111520; --panel2:#171d2a;
  --line:#1e2538; --line2:#283048; --text:#eef2f8; --muted:#8792a6;
  --accent:#7aa7ff; --violet:#b18cff; --amber:#f0b450; --red:#ff6b7a;
  --green:#5fd48a; --ring:#586377; --cyan:#5ec8d8;
  --hs:72%; --hl:62%;
  --font: 'Manrope', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --r: 10px;
  color-scheme: dark;
}
/* Light/dark is owned by cc-skin.css now (dark by default on bare :root,
   light only via explicit data-theme="light" — never auto from the OS).
   The old @media(prefers-color-scheme:light) override that used to live
   here was MORE specific than cc-skin.css's bare :root rule, so on any
   browser or OS defaulting to light it silently won the cascade and
   overrode the real design system back to a washed-out light theme
   regardless of load order. Removed; data-theme="light" is the only way
   to get light mode now, matching cc-skin.css's own stated contract. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);margin:0;font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}

/* Aurora bg */
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(122,167,255,.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 80% 70%,rgba(177,140,255,.05) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 50% 90%,rgba(95,212,138,.04) 0%,transparent 70%);animation:aurora 30s ease-in-out infinite alternate}
@keyframes aurora{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}

/* ═══════════════ SHELL ═══════════════ */
/* 2026-11-24 no-scroll pass: the rail and topbar stay put; #app is the one thing that scrolls,
   so switching tabs never means scrolling back up to reach the nav. Doesn't by itself make a
   page's content fit without its own scrollbar — see the per-view trims (Crew log, System
   Sources/Routines) for that part. */
.shell{display:flex;height:100vh;overflow:hidden}
.main{display:flex;flex-direction:column;min-height:0}
.topbar{flex:0 0 auto}
/* #app is a flex column now (was a plain block with overflow:auto): the crumb bar stays its
   natural size (flex:0 0 auto below) and whatever CC.views returns gets the rest. A view that
   doesn't opt in just renders at its natural height like before — nothing here forces anything
   to stretch. A view that DOES opt in (.hp-canvas, see below) gets flex:1 and can therefore fill
   "exactly what's left after the crumb" without any hardcoded pixel math, and clips instead of
   pushing #app's own scrollbar. */
#app{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
/* Full-screen "Knowledge" dashboard canvas — the category landing page, one click off the Wall.
   JD's rule: from the moment you land here, the whole screen is a canvas of modules, and it
   never scrolls as a page. Any one module with a long list scrolls internally instead
   (.hp-mod-scroll) — only the page-level scroll is banned. */
.hp-canvas{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.hp-canvas-body{flex:1 1 auto;min-height:0;display:grid;gap:12px}
.hp-mod{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.hp-mod-scroll{overflow-y:auto}
.hp-mod-title{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;justify-content:space-between;flex:0 0 auto;margin-bottom:10px;white-space:nowrap}
.hp-mod-title svg{width:13px;height:13px;flex:0 0 auto;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hp-mod-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.hp-mod-ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;line-height:1.5;border:1.5px dashed var(--line);border-radius:10px;padding:14px;gap:4px}
.hp-mod-ph b{color:var(--text);font-size:12.5px;font-weight:700}
.crumb{flex:0 0 auto}
.rail{width:52px;min-height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;position:fixed;top:0;left:0;z-index:100}
.rail-logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;margin-bottom:12px}
.rail-tabs{display:flex;flex-direction:column;gap:1px;flex:1}
.rail-btn{width:38px;height:38px;border:none;background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s,color .15s}
.rail-btn:hover{background:var(--panel2);color:var(--text)}
.rail-btn[aria-current="true"]{background:var(--accent);color:#fff}
.rail-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-btn .badge{position:absolute;top:3px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.rail-btn .badge:empty{display:none}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:1px}

.main{flex:1;min-width:0;padding:0 16px 20px}

/* ═══════════════ TOPBAR ═══════════════ */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;margin:12px 0 14px;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);position:sticky;top:0;z-index:50}
.tb-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tb-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 16px color-mix(in srgb,var(--accent) 50%,transparent)}
.tb-mark svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topbar h1{font-size:15px;font-weight:800;letter-spacing:.08em;margin:0;text-transform:uppercase;white-space:nowrap}
.tb-status{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.tb-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite}
.live.off{color:var(--muted)}
.live.off::before{background:var(--muted);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sample-tag{font-size:9px;padding:2px 5px;background:var(--amber);color:#000;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.build-tag{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.top-btn{width:28px;height:28px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.top-btn:hover{background:var(--panel2);color:var(--text)}
.top-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.refreshed{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ═══════════════ STATUS STRIP ═══════════════ */
.ss{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:12px}
.ss-p{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .15s}
.ss-p:hover{border-color:var(--accent)}
.ss-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ss-d.good{background:var(--green)}.ss-d.watch{background:var(--amber)}.ss-d.alert{background:var(--red)}.ss-d.none{background:var(--muted)}
.ss-p b{font-size:11px;font-weight:600}
.ss-p small{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

/* ═══════════════ SECTION / CARDS ═══════════════ */
.sh{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.sh h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.sh::after{content:'';flex:1;height:1px;background:var(--line)}

/* Breadcrumb for views reached off-rail (Sources, Records, Sheets, Local, Status) — see render() */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
/* 2026-11-25: these used to be all:unset text links styled like an arrow + a word — JD's call
   that nav controls should read as actual buttons. Real chrome now; Home (always jumps to
   Overview) sits next to Back (steps up one level) so you're never more than one tap from home
   no matter how deep a page goes. When Back's target IS Overview, we only show one button so you
   don't see two identical ones side by side. */
.crumb-back,.crumb-home{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;
  font-weight:600;color:var(--text);padding:7px 13px 7px 11px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line2)}
.crumb-back:hover,.crumb-home:hover{background:var(--line);border-color:var(--ring)}
.crumb-back svg,.crumb-home svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumb-t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:2px}

/* Wall view toggle (Map / Grid) */

/* Wall grid view: fixed 3x2 zones, now built from the shared .wd panel (see wgZone()) */
.wg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.wg3 .wd{min-height:220px;display:flex;flex-direction:column}
.wg3 .ov-rs{flex:1;overflow:auto}
@media(max-width:900px){.wg3{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card-h h3{font-size:12px;font-weight:700;margin:0;flex:1}
.card-h .cnt{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ═══════════════ STAT TILES ═══════════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat-v{font-size:22px;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:5px}
.stat-l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.stat-sp{margin-top:3px}
.stat-sp svg{width:100%;height:20px}
.trend{font-size:11px;font-weight:600}
.trend.up{color:var(--green)}.trend.dn{color:var(--red)}.trend.flat{color:var(--muted)}

/* ═══════════════ COMPACT TABLE ═══════════════ */
.ct{width:100%;border-collapse:collapse;font-size:12px}
.ct th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:3px 6px;border-bottom:1px solid var(--line)}
.ct td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ct tr:last-child td{border-bottom:none}
.ct tr:hover td{background:var(--panel2)}

/* ═══════════════ DOT / PILL ═══════════════ */
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;vertical-align:middle;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.late{background:var(--amber)}.dot.fail,.dot.stale{background:var(--red)}.dot.none,.dot.nodata{background:var(--muted)}
.fp{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-family:var(--mono);color:var(--muted);padding:1px 5px;border-radius:3px;background:var(--panel2);white-space:nowrap}
.fp .dot{width:5px;height:5px}

/* ═══════════════ ITEM ROWS ═══════════════ */
.ir{display:flex;align-items:baseline;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.ir:last-child{border-bottom:none}
.ir .src{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap;margin-left:auto;flex-shrink:0}
.due{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--amber);color:#000;font-weight:600;white-space:nowrap;flex-shrink:0}
.due.past{background:var(--red);color:#fff}

/* ═══════════════ LAYOUTS ═══════════════ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:1000px){.three{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}}

/* ═══════════════ CREW ═══════════════ */
.crew-av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:10px;color:#fff;flex-shrink:0}

/* ═══════════════ MESSAGES ═══════════════ */
.mr{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
.mr:last-child{border-bottom:none}
.mr .mf{font-weight:600;white-space:nowrap;min-width:40px}
.mr .ma{color:var(--muted)}
.mr .mt{font-weight:500;color:var(--muted);white-space:nowrap;min-width:40px}
.mr .mx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .mti{font-family:var(--mono);color:var(--muted);white-space:nowrap;flex-shrink:0;font-size:10px}

/* ═══════════════ PIPELINE ═══════════════ */
.pipe-s{display:flex;gap:2px;margin-bottom:6px}
.pipe-s span{flex:1;height:3px;border-radius:2px;background:var(--line)}
.pipe-s span.f{background:var(--accent)}
.pc{padding:6px 8px;border:1px solid var(--line);border-radius:5px;margin-bottom:4px}
.pc h4{margin:0;font-size:12px;font-weight:600}
.pc .meta{font-size:10px;color:var(--muted)}
.pc .nx{font-size:11px;margin-top:3px;padding:3px 6px;background:var(--panel2);border-radius:3px}

/* ═══════════════ BODY MAP ═══════════════ */
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px}
.bc{padding:5px 6px;border-radius:5px;text-align:center;font-size:10px;font-weight:600;border:1px solid var(--line)}

/* ═══════════════ RECORDS ═══════════════ */
.rd h4{font-size:11px;font-weight:700;margin:0 0 3px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.rd{margin-bottom:8px}
.rr{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0}
.rb{flex:0 0 40px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rb i{display:block;height:100%;background:var(--green);border-radius:2px}

/* ═══════════════ PROBLEMS ═══════════════ */
.pr{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
.pr:last-child{border-bottom:none}
.pr .pi{font-family:var(--mono);color:var(--accent);font-weight:600;white-space:nowrap}
.pr .pt{flex:1}
.pr .po{font-size:10px;color:var(--muted);white-space:nowrap}

/* ═══════════════ SKELETONS ═══════════════ */
.sk{animation:shimmer 1.5s ease-in-out infinite alternate}
@keyframes shimmer{0%{opacity:.5}100%{opacity:.15}}
.skl{height:12px;border-radius:3px;background:var(--line);margin-bottom:6px}
.sks{height:60px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}

/* ═══════════════ CONNECT SCREEN ═══════════════ */
.connect{max-width:360px;margin:60px auto;text-align:center}
.connect h3{font-size:16px;font-weight:800;margin:0 0 6px}
.connect p{font-size:12px;color:var(--muted);margin:0 0 16px}
.field{display:block;width:100%;padding:8px 10px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.field:focus{border-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--panel2)}
.btn.link{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.link:hover{opacity:.9}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:rgba(255,107,122,.1)}

/* ═══════════════ MOBILE ═══════════════ */
@media(max-width:700px){
  .main{padding-bottom:64px}
  .topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .tb-brand{flex:1 1 100%;order:-1}
  .topbar h1{font-size:13px}
  .refreshed{display:none}
  .mob{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:3px 0 max(3px,env(safe-area-inset-bottom,0px))}
  .mob button{flex:1;border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:9px;font-family:var(--font);cursor:pointer;position:relative}
  .mob button[aria-current="true"]{color:var(--accent)}
  .mob button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mob .badge{position:absolute;top:0;right:calc(50% - 16px);min-width:12px;height:12px;border-radius:6px;background:var(--red);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 2px}
  .mob .badge:empty{display:none}
}
@media(min-width:701px){.mob{display:none}}

/* ═══════════════ UTILS ═══════════════ */
.empty{text-align:center;padding:16px;color:var(--muted);font-size:12px}
.rt-s{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sp{display:inline-block;vertical-align:middle}
.sp svg{vertical-align:middle}
.warn-b{border-color:var(--amber)!important}
.error{padding:8px 12px;background:rgba(255,107,122,.12);border:1px solid var(--red);border-radius:6px;font-size:12px;color:var(--red);margin-bottom:8px}
</style>

<body>

<div class="shell">
<nav class="rail" id="rail"></nav>
<div class="main" id="main">
  <div class="topbar">
    <div class="tb-brand">
      <span class="tb-mark"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/></svg></span>
      <h1>Command Center</h1>

function its(tab,mod){if(!D)return[];return(D.items||[]).filter(function(i){return i.tab===tab&&(!mod||i.mod===mod)}).sort(function(a,b){return new Date(b.time)-new Date(a.time)})}
function newest(list){if(!list.length)return null;return list.reduce(function(b,i){var t=new Date(i.time).getTime();return t>b?t:b},0)}
function sumOf(s){if(!D)return null;return(D.summary||[]).find(function(x){return x.section===s})}
function parseLed(){
  return its("Business","Ledger").map(function(r){
    var ps=r.text.split("|").map(function(s){return s.trim()}),o={raw:r};
    ps.forEach(function(p){var m=/^([A-Za-z ]+):\s*(.*)$/.exec(p);if(m)o[m[1].toLowerCase().replace(/\s+/g,"_")]=m[2];else if(!o.id_)o.id_=p});
    o.total=parseInt(o.total)||0;o.collected=parseInt(o.collected)||0;o.balance=o.total-o.collected;return o;
  });
}
function parseNur(){
  var STAGES=["Inquiry","Talking","Contract","Deposit","Booked"];
  return its("Business","Nurturing").map(function(r){
    var ps=r.text.split("|").map(function(s){return s.trim()}),o={name:ps[0],raw:r};
    ps.slice(1).forEach(function(p){var m=/^([A-Za-z_ ]+):\s*(.*)$/.exec(p);if(m)o[m[1].toLowerCase().replace(/\s+/g,"_")]=m[2]});
    o.six=Math.max(0,STAGES.map(function(s){return s.toLowerCase()}).indexOf((o.stage||"").toLowerCase()));
    o.next=(o.next||"").split(/;\s*/).filter(Boolean);o.need=(o.need||"").split(/;\s*/).filter(Boolean);return o;
  });
}
function parseRec(){
  var recs=its("Records"),groups={},exp=[];
  recs.forEach(function(r){
    if(r.mod==="Expiring"){var p=r.text.split("|").map(function(s){return s.trim()});exp.push({name:p[0],dom:p[1]||"",due:r.due});return}
    var ps=r.text.split("|").map(function(s){return s.trim()}),dom=r.mod||"Other";
    (groups[dom]=groups[dom]||[]).push({type:ps[0]||"",n:parseInt(ps[1])||0,hard:parseInt(ps[2])||0,dig:parseInt(ps[3])||0,due:r.due||""});
  });
  return{groups:groups,exp:exp.sort(function(a,b){return(new Date(a.due||0))-(new Date(b.due||0))})};
}
function badges(){
  if(!D)return{};
  var dt=its("Today").filter(function(i){return i.due}).length;
  var bn=its("Business","Leads").length+its("Business","Waiting").length;
  var sp=(D.problems||[]).length+(D.routines||[]).filter(function(r){return r.st==="fail"||r.st==="late"}).length;
  var ca=(D.messages||[]).filter(function(m){return m.text&&m.text.indexOf("🔴")>-1}).length;
  return{wall:dt+bn,today:dt,biz:bn,sys:sp,crew:ca};
}

    return h("div",{class:"ov-r"},h("b",null,lbl),h("span",null,r.routine,"  ·  "+(r.last?ago(r.last):"no reading")));
  })));

  var rs=h("div",{style:"display:flex;flex-direction:column;gap:14px"});

    pc.appendChild(h("div",{class:"wd-h"},h("span",{class:"wd-t",style:"color:var(--amber)"},"Open problems"),h("span",{class:"wd-s"},String(probs.length))));

  rcc.appendChild(h("div",{class:"wd-h"},h("span",{class:"wd-t"},"Records registry")));
  var doms=Object.keys(rec.groups);

        de.appendChild(h("div",{class:"rr"},h("span",{style:"flex:1"},g.type),h("span",{class:"rb"},h("i",{style:"width:"+pct+"%"})),h("span",{style:"font-family:var(--mono);font-size:10px"},String(g.n)),g.due?h("span",{style:"font-size:9px;color:var(--amber);margin-left:4px"},"exp"):null));

    rcc.appendChild(h("div",{class:"ov-rs"},rec.exp.slice(0,3).map(function(e){return h("div",{class:"ov-r"},h("b",null,e.due?new Date(e.due).toLocaleDateString():""),h("span",null,e.name));})));

/* ── CREW ── */
/* 2026-11-24 design pass: crew cards moved onto .wd to match the rest of the app. Also fixed a real
   leak — the Message Log below used to dump the raw Luna/Argus/Atlas coordination feed verbatim
   (internal technical handoffs, tool errors, queue numbers) straight onto JD's dashboard with no
   context. It's still the same feed — nothing hidden — but now capped to a readable length per line
   and clearly labeled as an internal log, not status meant for him to parse line by line. */
function vCrew(){
  var el=h("div",{class:"wdpage"});

  var cardsWrap=h("div",{class:"wdgrid",style:"grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"});
  CREW.forEach(function(c){
    var msgs=(D.messages||[]).filter(function(m){return m.from===c.k});
    var last=msgs[0];
    cardsWrap.appendChild(h("section",{class:"wd",style:"--c:"+c.c},
      h("div",{style:"display:flex;align-items:center;gap:8px"},
        h("div",{class:"crew-av",style:"background:"+c.c},c.n.charAt(0)),
        h("div",null,h("div",{style:"font-weight:700;font-size:13px"},c.n),h("div",{style:"font-size:10px;color:var(--muted)"},c.r))
      ),
      h("div",{class:"ov-line",style:"margin-top:8px"},h("span",null,last?"Last: "+ago(last.time):"No recent activity")),
      last?h("div",{style:"font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},last.text.length>90?last.text.slice(0,90)+"…":last.text):null
    ));
  });
  el.appendChild(cardsWrap);

  var mc=h("section",{class:"wd"});
  mc.appendChild(h("div",{class:"wd-h"},h("span",{class:"wd-t"},"Internal coordination log"),h("span",{class:"wd-s"},"How your AIs hand work to each other — not written for you to read line by line")));
  function logRow(m){
    var f=CREW.find(function(c){return c.k===m.from})||{n:m.from,c:"var(--muted)"};
    var t=CREW.find(function(c){return c.k===m.to})||{n:m.to,c:"var(--muted)"};
    var txt=String(m.text||"");if(txt.length>140)txt=txt.slice(0,140)+"…";
    return h("div",{class:"ov-r"},h("b",null,ago(m.time)),h("span",null,h("span",{style:"color:"+f.c+";font-weight:600"},f.n),h("span",{style:"color:var(--muted)"}," → "+t.n+": "),txt));
  }
  /* 2026-11-24 no-scroll pass: show 4 inline, push the rest behind "View all" (CC.sheet) instead
     of letting this list grow the page past the viewport. */
  var all=D.messages||[], VIS=4;
  mc.appendChild(all.length?h("div",{class:"ov-rs"},all.slice(0,VIS).map(logRow)):h("div",{class:"ov-empty"},"No messages yet"));
  if(all.length>VIS)mc.appendChild(h("button",{type:"button",class:"cc-more",onclick:function(){CC.sheet("Internal coordination log · "+all.length,h("div",{class:"ov-rs"},all.map(logRow)))}},"View all "+all.length+" ↓"));
  el.appendChild(mc);
  return el;
}

/* ══════════ RENDER ══════════ */
function render(){
  var app=document.getElementById("app");app.innerHTML="";
  if(!D){var sk=h("div",{class:"sk"});for(var i=0;i<3;i++)sk.appendChild(h("div",{class:"skl",style:"width:"+(55+Math.random()*35)+"%"}));sk.appendChild(h("div",{class:"stats"},h("div",{class:"sks"}),h("div",{class:"sks"}),h("div",{class:"sks"}),h("div",{class:"sks"})));for(var j=0;j<4;j++)sk.appendChild(h("div",{class:"skl",style:"width:"+(45+Math.random()*40)+"%;margin-top:8px"}));app.appendChild(sk);return}
  document.getElementById("stag").hidden=!D.sample;

  /* 2026-11-24 audit fix: the rail only has six buttons (TABS below), but several views
     (Sources, Records, Connected Sheets, Local, Status) are reachable only by api.go() calls
     from inside other pages — the Wall hub map, the Sources page's own sections, and so on.
     Landing on one of those used to leave every rail button unselected with no way back short
     of the browser's own back button — the single biggest source of "the nav feels confusing."
     This bar is the fix: whenever TAB isn't one of the rail's own ids, show where you are and
     a one-click way home. */
  var RAIL_IDS=TABS.map(function(t){return t.id});
  if(RAIL_IDS.indexOf(TAB)===-1){
    var CRUMB_TITLES={Sources:"Sources",Records:"Records",Sheets:"Connected Sheets",Local:"Local",Status:"Status"};
    var CRUMB_BACK={};
    /* Auto-register crumbs for every catPage: dashboard shows category name, -data shows "Name — Information"
       and steps back to the dashboard. */
    if(CC.catPages)Object.keys(CC.catPages).forEach(function(k){var v=CC.catPages[k];CRUMB_TITLES[v]=k;CRUMB_TITLES[v+"-data"]=k+" — Information";CRUMB_BACK[v+"-data"]={id:v,l:k}});
    var back=CRUMB_BACK[TAB]||{id:"wall",l:"Overview"};
    function crumbIcon(d){return svgEl("svg",{viewBox:"0 0 24 24"},[svgEl("path",{d:d})])}
    var CHEVRON="M15 18l-6-6 6-6", HOUSE="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 21v-8h6v8";
    var crumbBtns=[h("button",{type:"button",class:"crumb-back",onclick:function(){go(back.id)}},crumbIcon(CHEVRON),back.l)];
    if(back.id!=="wall")crumbBtns.push(h("button",{type:"button",class:"crumb-home",onclick:function(){go("wall")}},crumbIcon(HOUSE),"Overview"));
    crumbBtns.push(h("span",{class:"crumb-t"},CRUMB_TITLES[TAB]||TAB));
    app.appendChild(h("div",{class:"crumb"},crumbBtns));
  }

  /* Check for external view overrides (CC.views.Business etc.) */
  var TAB_MAP = {wall:"Wall",today:"Today",biz:"Business",priv:"Private",sys:"System",build:"Build",crew:"Crew"};
  /* Auto-register catPage tab IDs → CC.views keys */
  if(CC.catPages)Object.keys(CC.catPages).forEach(function(k){var v=CC.catPages[k];var clean=k.replace(/[^A-Za-z0-9]/g,"");TAB_MAP[v]=clean;TAB_MAP[v+"-data"]=clean+"Data"});
  var tabName = TAB_MAP[TAB] || TAB;
  if(CC.views[tabName]){
    try{
      var CCAPI = {
        h:h, data:D, ago:ago, usd:usd, sp:sp, fp:fp, tr:tr, sh:sh,
        iso:iso, clk:clk, its:its, newest:newest, sumOf:sumOf,
        parseLed:parseLed, parseNur:parseNur, parseRec:parseRec,
        CREW:CREW, TABS:TABS, render:render, go:go,
        /* contract surface (views/CONTRACT.md) */
        svgEl:svgEl, icon:iconFor, cfgVal:cfgVal, nowMs:nowMs, sheetAt:sheetAt,
        moduleStatus:moduleStatus, summaryRows:summaryRows, summaryStatus:summaryStatus,
        clock:clockOne, clockRange:clockRange, dayOffset:dayOffset, shortName:shortName,
        crew:crewTuples(), tab:tabName
      };
      var result=CC.views[tabName](CCAPI);
      if(result){app.appendChild(result);return}
      console.warn("CC.views."+tabName+" returned nothing, falling back to built-in");
    }catch(e){
      console.error("CC.views."+tabName+" error, falling back to built-in:",e);
    }
  }

  var V={wall:vWall,today:vToday,biz:vBiz,priv:vPriv,sys:vSys,crew:vCrew};
  app.appendChild((V[TAB]||vWall)());
}

/* Expose CCAPI on CC namespace for external scripts that need it at load time */
CC.api = {h:h,ago:ago,usd:usd,sp:sp,fp:fp,tr:tr,sh:sh,iso:iso,clk:clk,render:render,
  svgEl:svgEl,icon:iconFor,cfgVal:cfgVal,nowMs:nowMs,sheetAt:sheetAt,
  moduleStatus:moduleStatus,summaryRows:summaryRows,summaryStatus:summaryStatus,
  clock:clockOne,clockRange:clockRange,dayOffset:dayOffset,shortName:shortName,
  get data(){return D}, get crew(){return crewTuples()}, get tab(){return TAB}};

/* ══════════ NAV ══════════ */
function buildNav(){
  var rail=document.getElementById("rail"),mob=document.getElementById("mob");
  rail.innerHTML="";mob.innerHTML="";
  /* Markup matches cc-skin.css/cc-design.css's rail contract exactly
     (.rmark/i, button[aria-selected]/.rlab/.rn) so the real Aurora
     Centered skin — Atlas-owned per CONTRACT.md — drives the rail
     instead of an ad hoc shell theme. */
  var mark=h("div",{class:"rmark"});
  var markSvg=svgEl("svg",{viewBox:"0 0 24 24"});markSvg.innerHTML=CC_MARK_ICON;mark.appendChild(markSvg);
  rail.appendChild(mark);
  var bg=badges();
  TABS.forEach(function(t){
    var btn=h("button",{"aria-selected":String(t.id===TAB),title:t.l,onclick:function(){go(t.id)}});
    btn.innerHTML='<svg viewBox="0 0 24 24">'+t.i+'</svg>';
    btn.appendChild(h("span",{class:"rlab"},t.l));
    var b=h("span",{class:"rn"});if(bg[t.id])b.textContent=bg[t.id];else b.style.display="none";
    btn.appendChild(b);
    rail.appendChild(btn);
    var mb=h("button",{"aria-current":String(t.id===TAB),onclick:function(){go(t.id)}});
    mb.innerHTML='<svg viewBox="0 0 24 24">'+t.i+'</svg>';
    mb.appendChild(h("span",null,t.l));
    var mb2=h("span",{class:"badge"});if(bg[t.id])mb2.textContent=bg[t.id];mb.appendChild(mb2);
    mob.appendChild(mb);
  });
  rail.appendChild(h("div",{class:"rsp"}));
}
/* 2026-11-25: JD stumbled onto a retired dashboard (old Business/Today/System/Private/Status
   pages — still fully defined in cc-widgets.js and views/system.js, just no longer on the rail)
   by clicking "Go to Business" inside the Inbox panel's alert detail (cc-inbox.js's jump()
   still calls go() with those old capitalized tab names). Rather than patch every caller that
   might still hold a stale destination, go() itself is now the single checkpoint: it only ever
   lands on a page that's actually live today, and quietly sends anything else back to Overview.
   Add a page's id here (or register it in CC.catPages) when it's really ready to be reached. */
function go(id){
  var allowed={wall:1,build:1,Sources:1,Records:1,Sheets:1};
  TABS.forEach(function(t){allowed[t.id]=1});
  if(CC.catPages)Object.keys(CC.catPages).forEach(function(k){var v=CC.catPages[k];allowed[v]=1;allowed[v+"-data"]=1});
  if(!allowed[id]){console.warn('[nav] blocked go("'+id+'") — that page is retired, not reachable; returning to Overview');id="wall"}
  TAB=id;buildNav();render();window.scrollTo(0,0)
}

function toggleTheme(){
  var r=document.documentElement,c=r.getAttribute("data-theme"),n=c==="light"?"dark":"light";
  r.setAttribute("data-theme",n);try{localStorage.setItem("cc_theme",n)}catch(e){}

/* ══════════ CONNECTION ══════════ */
var memCfg=null;
function getCfg(){try{var c=JSON.parse(localStorage.getItem("cc_cfg")||"null");if(c&&c.url&&c.key)return c}catch(e){}return memCfg}
function setCfg(c){memCfg=c;try{localStorage.setItem("cc_cfg",JSON.stringify(c))}catch(e){}}
function clearCfg(){memCfg=null;try{localStorage.removeItem("cc_cfg")}catch(e){}}

function connectScreen(note){
  D=null;
  var li=document.getElementById("live-ind");
  li.textContent="Offline";li.className="live off";
  document.getElementById("refreshed").textContent="Not connected";
  var app=document.getElementById("app");app.textContent="";

  var url=h("input",{class:"field",type:"url",placeholder:"Web app URL (ends in /exec)",autocomplete:"off"});
  var key=h("input",{class:"field",type:"password",placeholder:"Access key",autocomplete:"off"});
  var msg=h("div",{class:"empty"},note||"");

  function doConnect(){
    var c={url:url.value.trim(),key:key.value.trim()};
    if(!c.url||!c.key){msg.textContent="Both fields are required.";return}
    setCfg(c);loadData();
  }

  app.appendChild(h("div",{class:"connect"},
    h("h3",null,"Connect"),
    h("p",null,"Enter the web app URL and access key from your Apps Script project. They are stored only in this browser."),
    url,key,msg,
    h("div",{class:"acts"},
      h("button",{class:"btn link",type:"button",onclick:doConnect},"Connect"),
      h("button",{class:"btn",type:"button",onclick:function(){D=normalizeData(sampleData());buildNav();render()}},"Preview sample")
    )
  ));
}

function disconnect(){
  if(!confirm("Disconnect from data source? You can reconnect anytime."))return;
  clearCfg();
  if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}
  connectScreen();
}

function showError(err){
  var msg=err&&err.message?err.message:String(err);
  if(msg==="Bad key"){connectScreen("That key was not accepted.");return}
  var app=document.getElementById("app");
  app.insertBefore(h("div",{class:"error"},"Could not load: "+msg),app.firstChild);
}

/* ══════════ LOAD DATA ══════════ */
function loadData(){
  var cfg=getCfg();
  if(!cfg){if(!D)connectScreen();return}

  // Show skeleton while loading
  if(!D){
    var app=document.getElementById("app");app.innerHTML="";
    var sk=h("div",{class:"sk"});
    for(var i=0;i<3;i++)sk.appendChild(h("div",{class:"skl",style:"width:"+(55+Math.random()*35)+"%"}));
    sk.appendChild(h("div",{class:"stats"},h("div",{class:"sks"}),h("div",{class:"sks"}),h("div",{class:"sks"}),h("div",{class:"sks"})));
    app.appendChild(sk);
  }

  var url=cfg.url+(cfg.url.indexOf("?")>-1?"&":"?")+("key="+encodeURIComponent(cfg.key));
  fetch(url).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw new Error(j.error);

    D=normalizeData(j.data);
    lastLoadTime=Date.now();

    var li=document.getElementById("live-ind");
    li.textContent="Live";li.className="live";
    document.getElementById("refreshed").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    document.getElementById("dbtn").hidden=false;

    buildNav();render();

    // Start auto-refresh
    if(!refreshTimer){
      refreshTimer=setInterval(function(){loadData()},REFRESH_MS);
    }
  }).catch(function(err){
    showError(err);
    // If we had data before, keep showing it
    if(D){
      var li=document.getElementById("live-ind");
      li.textContent="Stale";li.className="live off";
    }
  });
}

/* ══════════ INIT ══════════ */
(function(){
  try{var t=localStorage.getItem("cc_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
  document.getElementById("tbtn").addEventListener("click",toggleTheme);
  document.getElementById("rbtn").addEventListener("click",function(){D=null;render();loadData()});
  document.getElementById("dbtn").addEventListener("click",disconnect);
  buildNav();render();loadData();

  // Soft re-render every 30s to keep "ago" times fresh
  setInterval(function(){if(D)render()},30000);

  // Auto-lock on visibility change (pause refresh when hidden)
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){
      if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}
    }else{
      if(getCfg()&&!refreshTimer){
        loadData();
        refreshTimer=setInterval(function(){loadData()},REFRESH_MS);
      }
    }
  });
})();

})();
